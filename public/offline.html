<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LARVAZ HIPHOP — Sin Conexión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0A0A0A;
      color: #F5F5F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: #151515;
      color: #C6FF00;
      border: 1px solid #C6FF00;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }
    h1 span {
      color: #C6FF00;
    }
    p {
      color: #A3A3A3;
      max-width: 440px;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #C6FF00;
      color: #0A0A0A;
      font-weight: 800;
      padding: 12px 28px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #B2E600;
    }
  </style>
</head>
<body>
  <div class="badge">ESTADO FUERA DE LÍNEA</div>
  <h1>SIN CONEXIÓN A <span>LARVAZ</span></h1>
  <p>El muro digital de hip-hop necesita acceso a Internet para sincronizar nuevas publicaciones, pistas de audio, videos y eventos comunitarios.</p>
  <button class="btn" onclick="window.location.reload()">Reintentar Conexión</button>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1A2E05" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#95CC00"/>
    </linearGradient>
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="100%" stop-color="#C20063"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0A0A0A"/>
  <rect width="512" height="512" rx="96" fill="url(#bgGlow)"/>
  
  <!-- Outer Street Border -->
  <rect x="24" y="24" width="464" height="464" rx="72" fill="none" stroke="#202020" stroke-width="4"/>
  <rect x="20" y="20" width="472" height="472" rx="76" fill="none" stroke="#C6FF00" stroke-width="2" stroke-dasharray="24 16" opacity="0.4"/>

  <!-- Graffiti Stylized L Z Emblem -->
  <g transform="translate(64, 80)">
    <!-- Vinyl record disc silhouette in background -->
    <circle cx="192" cy="176" r="140" fill="#121212" stroke="#252525" stroke-width="6"/>
    <circle cx="192" cy="176" r="95" fill="none" stroke="#1c1c1c" stroke-width="3" stroke-dasharray="6 4"/>
    <circle cx="192" cy="176" r="60" fill="none" stroke="#222" stroke-width="2"/>
    <circle cx="192" cy="176" r="38" fill="#FF2D95" fill-opacity="0.9"/>
    <circle cx="192" cy="176" r="10" fill="#0A0A0A"/>
    
    <!-- Bold Underground Letterform 'L' & 'Z' -->
    <path d="M 60 70 L 120 70 L 120 220 L 220 220 L 220 270 L 60 270 Z" fill="url(#acidGrad)" filter="drop-shadow(0 4px 12px rgba(198,255,0,0.4))"/>
    <path d="M 180 70 L 320 70 L 220 190 L 320 190 L 320 250 L 170 250 L 270 130 L 180 130 Z" fill="#F5F5F5" opacity="0.95" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.8))"/>

    <!-- Graffiti spray splatter dots -->
    <circle cx="340" cy="80" r="6" fill="#C6FF00"/>
    <circle cx="355" cy="98" r="3" fill="#C6FF00" opacity="0.7"/>
    <circle cx="335" cy="110" r="4" fill="#FF2D95"/>
    <circle cx="50" cy="240" r="5" fill="#00D9FF"/>
    <circle cx="38" cy="256" r="3" fill="#00D9FF" opacity="0.6"/>
  </g>

  <!-- Typography: LARVAZ -->
  <text x="256" y="420" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="#F5F5F5" text-anchor="middle" letter-spacing="8">
    LARVAZ
  </text>
  <text x="256" y="456" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#C6FF00" text-anchor="middle" letter-spacing="12">
    HIPHOP
  </text>
</svg>
